name: Construire les installateurs

# Produit un installateur pour chacun des trois systèmes :
#
#   Windows      PythonLearn-Setup-<version>.exe        (installateur classique)
#                PythonLearn-<version>-windows-portable.exe
#   macOS        PythonLearn-<version>-arm64.dmg        (Mac Apple Silicon)
#   Linux        python-learn_<version>_amd64.deb       (Debian, Ubuntu, Mint…)
#                python-learn-<version>-linux-amd64.tar.gz  (toutes distributions)
#
# Se déclenche :
#   - sur un tag « vX.Y.Z » -> construit ET publie une Release ;
#   - à la main depuis l'onglet Actions -> construit seulement, pour essayer.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire (laisser vide pour celle de app/version.py)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  preparer:
    name: Vérifier et déterminer la version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calcul.outputs.version }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Tk
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      # On ne publie jamais une version dont les exercices ne passent plus.
      - name: Lancer les tests
        run: python -m unittest discover -s tests

      - name: Déterminer la version
        id: calcul
        shell: bash
        run: |
          declaree=$(python -c "from app.version import __version__; print(__version__)")
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$declaree" ]; then
              echo "::error::Le tag « ${GITHUB_REF_NAME} » annonce la version $tag, mais app/version.py déclare $declaree. Aligne les deux puis repose le tag."
              exit 1
            fi
            version="$tag"
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="$declaree"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version retenue : $version"

  # ---------------------------------------------------------------------------
  construire:
    name: ${{ matrix.nom }}
    needs: preparer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Windows
            os: windows-latest
            arch: x86_64
          # GitHub a retiré ses runners macOS Intel : il n'existe plus
          # d'image x86_64 pour produire un .dmg compatible Mac Intel. Ces
          # machines peuvent lancer l'application depuis les sources.
          # « macos-latest » plutôt qu'une version figée, pour ne pas se
          # retrouver bloqué au prochain retrait d'image.
          - nom: macOS (Apple Silicon)
            os: macos-latest
            arch: arm64
          # Volontairement une version ancienne d'Ubuntu : un binaire compilé
          # sur une vieille glibc fonctionne sur les distributions récentes,
          # l'inverse n'est pas vrai.
          - nom: Linux
            os: ubuntu-22.04
            arch: amd64

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Installer PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # ------------------------------------------------------------- Windows
      - name: Construire l'exécutable (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --icon assets/icon.ico --name PythonLearn main.py

      - name: Contrôler l'exécutable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Un exécutable « windowed » n'a pas de sortie console : c'est le
          # code de retour qui nous dit si l'empaquetage est complet.
          $p = Start-Process -FilePath "dist\PythonLearn.exe" -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Contrôle de santé en échec (code $($p.ExitCode)) : l'exécutable est incomplet."
          }
          Write-Host "Exécutable vérifié."

      - name: Construire l'installateur (Windows, Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMaVersion=${{ needs.preparer.outputs.version }} `
            packaging\installer.iss

      - name: Nommer l'exécutable portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/PythonLearn.exe "dist/PythonLearn-${{ needs.preparer.outputs.version }}-windows-portable.exe"

      # --------------------------------------------------------------- macOS
      - name: Construire l'application (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --windowed --icon assets/icon.icns --name PythonLearn main.py

      - name: Contrôler l'application (macOS)
        if: runner.os == 'macOS'
        run: dist/PythonLearn.app/Contents/MacOS/PythonLearn --check

      - name: Construire le disque d'installation (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/macos/construire-dmg.sh "${{ needs.preparer.outputs.version }}" "${{ matrix.arch }}"

      # --------------------------------------------------------------- Linux
      - name: Construire l'exécutable (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --onefile --name PythonLearn main.py

      - name: Contrôler l'exécutable (Linux)
        if: runner.os == 'Linux'
        run: ./dist/PythonLearn --check

      - name: Construire le .deb et l'archive (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/linux/construire-paquets.sh "${{ needs.preparer.outputs.version }}"

      # ------------------------------------------------------- mise en commun
      - name: Rassembler les fichiers à livrer
        shell: bash
        run: |
          mkdir -p livraison
          shopt -s nullglob
          fichiers=(dist/*.exe dist/*.dmg dist/*.deb dist/*.tar.gz Output/*.exe)
          if [ ${#fichiers[@]} -eq 0 ]; then
            echo "::error::Aucun fichier d'installation produit sur ${{ matrix.os }}."
            exit 1
          fi
          cp "${fichiers[@]}" livraison/
          ls -lh livraison/

      - name: Publier les fichiers comme artefacts
        uses: actions/upload-artifact@v4
        with:
          name: installateurs-${{ matrix.os }}
          path: livraison/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  publier:
    name: Publier la Release
    needs: [preparer, construire]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer tous les installateurs
        uses: actions/download-artifact@v4
        with:
          path: livraison
          merge-multiple: true

      - name: Calculer les empreintes SHA-256
        run: |
          cd livraison
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Créer la Release
        uses: softprops/action-gh-release@v2
        with:
          files: livraison/*
          generate_release_notes: true
          body: |
            ## Installer PythonLearn ${{ needs.preparer.outputs.version }}

            Aucune installation de Python n'est nécessaire : tout est inclus.

            ### Windows
            Télécharge **`PythonLearn-Setup-${{ needs.preparer.outputs.version }}.exe`** et lance-le.
            L'application s'installe pour ton compte, sans droits administrateur.

            > Windows affiche un avertissement SmartScreen pour un programme
            > non signé : *Informations complémentaires* → *Exécuter quand même*.

            Tu préfères ne rien installer ? Prends la version **portable**, qui
            se lance directement depuis le fichier téléchargé.

            ### macOS (Apple Silicon — M1 et suivants)
            Ouvre **`PythonLearn-${{ needs.preparer.outputs.version }}-arm64.dmg`**,
            glisse PythonLearn dans Applications, puis au **premier lancement**
            fais un clic droit sur l'application → *Ouvrir*. Cette
            confirmation n'est demandée qu'une fois.

            > **Mac Intel** : aucun `.dmg` n'est fourni, faute de machine de
            > construction Intel disponible. L'application fonctionne malgré
            > tout : installe Python depuis [python.org](https://www.python.org/downloads/),
            > télécharge le code source de cette Release, puis lance
            > `python main.py`.

            ### Linux
            - Debian, Ubuntu, Mint : `sudo apt install ./python-learn_${{ needs.preparer.outputs.version }}_amd64.deb`
            - Autres distributions : décompresse l'archive `.tar.gz`, puis `bash installer.sh`
              (installe pour ton compte, sans `sudo`).

            ### Vérifier le téléchargement
            Les empreintes des fichiers sont dans `SHA256SUMS.txt`.
