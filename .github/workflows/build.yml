name: Build executables

# Variante "sous-dossier" : le projet est dans python-learn/ et non à la racine.
# Si un jour tu remontes les fichiers à la racine, supprime le bloc
# "defaults: working-directory" et les préfixes "python-learn/" plus bas.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python-learn      # <-- les commandes tournent ici
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PythonLearn-windows.exe
          - os: macos-latest
            artifact: PythonLearn-macos
          - os: ubuntu-latest
            artifact: PythonLearn-linux

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Tk (Linux uniquement)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Installer PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Construire l'exécutable (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --icon assets/icon.ico --name PythonLearn main.py

      - name: Construire l'exécutable (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --onefile --windowed --icon assets/icon.icns --name PythonLearn main.py

      - name: Construire l'exécutable (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --onefile --windowed --name PythonLearn main.py

      - name: Renommer (Windows)
        if: runner.os == 'Windows'
        run: Rename-Item dist/PythonLearn.exe ${{ matrix.artifact }}
        shell: pwsh

      - name: Renommer (macOS / Linux)
        if: runner.os != 'Windows'
        run: mv dist/PythonLearn dist/${{ matrix.artifact }}

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: python-learn/dist/${{ matrix.artifact }}

      - name: Joindre à la Release (sur tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: python-learn/dist/${{ matrix.artifact }}
