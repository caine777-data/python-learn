name: Tests

# Valide automatiquement tout le curriculum (les solutions doivent passer
# leurs tests) à chaque push et chaque pull request.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer les tests
        run: python -m unittest discover -s tests -v
